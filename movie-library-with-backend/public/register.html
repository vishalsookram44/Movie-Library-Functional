<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - TV Movie</title>
  <meta name="description" content="Tvflix is a popular movie app." />
  <link rel="shortcut icon" href="./assets/images/tv movie.png" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/auth.css" />
  <script src="./assets/js/register-page.js" type="module"></script>
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="./index.html">
        <img src="./assets/images/logo2.png" width="140" height="32" alt="Tvflix home" class="logo" />
      </a>

      <h1 class="auth-title">Create Account</h1>

      <form register-form>
        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" />
        </div>

        <div class="form-field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn-login auth-submit">Sign Up</button>

        <p class="form-error" form-error></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="./login.html">Log in</a></p>
    </div>
  </div>
</body>

</html>
